################################################################################
##  Job submission arguments
################################################################################

local = True
# Must stay at 1 with dingo 0.9.8 + bilby_pipe 1.5+: any value > 1 sends the importance
# sampling node down a code path that reads inputs.htcondor_strict_cpu_request, which
# dingo's MainInput does not define (AttributeError before the job is even built).
request-cpus-importance-sampling = 1

################################################################################
##  Sampler arguments
################################################################################

model = checkpoints/part2b_toy.pt
device = 'cpu'
num-samples = 20000
batch-size = 20000
recover-log-prob = false
importance-sample = true

################################################################################
## Data generation arguments
################################################################################

trigger-time = GW150914
label = GW150914
outdir = outdir_GW150914
channel-dict = {H1:GWOSC, L1:GWOSC}
psd-length = 128
sampling-frequency = 4096.0
# bilby_pipe fetches 16384 Hz open data by default. We only analyze to 1024 Hz, so
# take the 4 kHz GWOSC files instead -- 4x smaller, and cache them between segments.
fetch-open-data-kwargs = {sample_rate: 4096, cache: True}

################################################################################
## Plotting arguments
################################################################################

plot-corner = true
plot-weights = true
plot-log-probs = true
