# Small enough to generate live in the session: roughly 250 core-seconds, measured at 25 s
# with --num_processes 10 on an idle laptop. Same domain and same prior as the dataset the
# shipped network trained on, and compressed the same way; only num_samples differs.
domain:
  type: UniformFrequencyDomain
  f_min: 20.0
  f_max: 1024.0
  delta_f: 0.25

waveform_generator:
  approximant: IMRPhenomD
  f_ref: 20.0

# Spins are aligned with the orbital angular momentum, which is what IMRPhenomD models: one
# component per black hole, drawn from bilby's AlignedSpin prior with magnitude up to 0.9.
intrinsic_prior:
  mass_1: bilby.core.prior.Constraint(minimum=10.0, maximum=80.0, name='mass_1')
  mass_2: bilby.core.prior.Constraint(minimum=10.0, maximum=80.0, name='mass_2')
  chirp_mass: bilby.gw.prior.UniformInComponentsChirpMass(minimum=15.0, maximum=100.0, name='chirp_mass')
  mass_ratio: bilby.gw.prior.UniformInComponentsMassRatio(minimum=0.125, maximum=1.0, name='mass_ratio')
  phase: default
  chi_1: bilby.gw.prior.AlignedSpin(name='chi_1', a_prior=Uniform(minimum=0, maximum=0.9))
  chi_2: bilby.gw.prior.AlignedSpin(name='chi_2', a_prior=Uniform(minimum=0, maximum=0.9))
  theta_jn: default
  luminosity_distance: 100.0  # Mpc
  geocent_time: 0.0  # s

num_samples: 5000

compression:
  svd:
    num_training_samples: 1000
    num_validation_samples: 100
    size: 100
