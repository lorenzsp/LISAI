# The in-session training demo: three epochs on the 5000-waveform dataset, small
# network, so that loss output appears within a couple of minutes. The shipped network
# used the same fields with larger numbers in them.
data:
  waveform_dataset_path: waveform_dataset.hdf5
  train_fraction: 0.95
  detectors:
    - H1
    - L1
  extrinsic_prior:
    dec: default
    ra: default
    geocent_time: bilby.core.prior.Uniform(minimum=-0.10, maximum=0.10, name='geocent_time')
    psi: default
    luminosity_distance: bilby.core.prior.Uniform(minimum=100.0, maximum=1000.0, name='luminosity_distance')
  ref_time: 1126259462.391
  inference_parameters:
  - chirp_mass
  - mass_ratio
  - chi_1
  - chi_2
  - theta_jn
  - dec
  - ra
  - geocent_time
  - luminosity_distance
  - psi
  - phase

model:
  posterior_model_type: normalizing_flow
  posterior_kwargs:
    num_flow_steps: 5
    base_transform_kwargs:
      hidden_dim: 64
      num_transform_blocks: 5
      activation: elu
      dropout_probability: 0.0
      batch_norm: True
      num_bins: 8
      base_transform_type: rq-coupling
  embedding_kwargs:
    output_dim: 128
    hidden_dims: [1024, 512, 256, 128]
    activation: elu
    dropout: 0.0
    batch_norm: True
    svd:
      num_training_samples: 1000
      num_validation_samples: 100
      size: 50

training:
  stage_0:
    epochs: 3
    asd_dataset_path: asds_O1.hdf5
    freeze_rb_layer: True
    optimizer:
      type: adam
      lr: 0.0005
    scheduler:
      type: cosine
      T_max: 3
    batch_size: 64

local:
  device: cpu
  num_workers: 0
  runtime_limits:
    max_time_per_run: 3600
    max_epochs_per_run: 3
  checkpoint_epochs: 3
